name: PR Unit Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          # Skip DB-dependent tests in PR CI (they require DATABASE_URL)
          DATABASE_URL: ''

  bridge-test:
    name: Voxtral Bridge Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/voxtral-bridge/requirements*.txt

      - name: Install dependencies
        working-directory: services/voxtral-bridge
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        working-directory: services/voxtral-bridge
        run: pytest
