<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E5BC1" />
    <title>GhostTyper – Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0a1422; color: #f8fafc; }
      main { width: min(30rem, calc(100% - 3rem)); text-align: center; }
      img { width: 5rem; height: 5rem; object-fit: contain; }
      h1 { margin: 1rem 0 .5rem; font-size: 1.5rem; }
      p { margin: 0; color: #cbd5e1; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Keine Verbindung / No connection</h1>
      <p>Gespeicherte Aufnahmen werden synchronisiert, sobald GhostTyper wieder online ist.</p>
    </main>
  </body>
</html>
